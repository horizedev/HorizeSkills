version: 2
name: continuous-idea-to-mvp
description: Continuous, founder-directed workstreams that turn raw intent into a tested MVP without internal approval gates.
global_rules:
  artifact_root: ventures/<venture-slug>/artifacts
  evidence_root: ventures/<venture-slug>/evidence
  decision_root: ventures/<venture-slug>/decisions
  canonical_artifact: idea-to-mvp-workbook.md
  workflow_mode: continuous
  require_sources_for_external_claims: true
  require_founder_authorization_for_external_actions: true
  aas_stack: aas-stack.json
  aas_skill_map: workflow/aas-skill-map.yaml
workstreams:
  - id: founder-intent
    name: founder intent and venture framing
    purpose: Preserve the founder's observations, product ideas, feature ideas, design direction, business goals, constraints, and unknowns as active inputs to the MVP.
    primary_roles: [venture-orchestrator]
    local_skills: [product-pipeline-governance]
    workbook_sections: [Founder Intent, Venture Frame, Direction Log, Assumption Map]
    aas_capabilities: [brainstorming, idea-refine, product-manager]
    completion_signals: [founder input is classified, product thesis is explicit, material tensions are visible]
  - id: opportunity-research
    name: integrated opportunity research
    purpose: Combine problem discovery, customer evidence, market and competitor research, demand design, pricing, business viability, and risk issue spotting into one evidence loop.
    primary_roles: [customer-discovery-analyst, market-intelligence-analyst, demand-validation-designer, business-case-analyst, research-evidence-auditor, legal-privacy-risk-spotter]
    local_skills: [customer-discovery, market-opportunity, demand-validation, business-case]
    workbook_sections: [Opportunity Evidence, Market and Alternatives, Demand and Viability, Risk Register]
    aas_capabilities: [customer-research, competitor-profiling, startup-business-analyst-market-opportunity, ab-testing, pricing, startup-business-analyst-business-case]
    completion_signals: [highest-risk assumptions have tests, claims are sourced or labeled, a reachable wedge and viable boundary are articulated]
  - id: mvp-definition
    name: product, experience, and market definition
    purpose: Turn founder intent and evidence into a focused MVP, user experience, positioning, measurement plan, and truthful product communication.
    primary_roles: [product-manager, ux-specification-designer, brand-gtm-strategist, product-analytics-analyst]
    local_skills: [mvp-product-spec, brand-go-to-market]
    workbook_sections: [MVP Definition, Experience Specification, Product Narrative, Measurement Plan]
    aas_capabilities: [product-manager, ui-ux-pro-max, ux-flow, frontend-design, design-system, product-marketing-context, copywriting, analytics-tracking]
    completion_signals: [core journey is testable, non-goals are explicit, product expression reflects founder direction and evidence]
  - id: delivery-loop
    name: integrated MVP delivery
    purpose: Combine architecture, privacy and security design, operations planning, implementation, code review, and quality verification in one build-and-learn loop.
    primary_roles: [solution-architect, platform-operations-engineer, mvp-implementation-engineer, qa-release-engineer, code-quality-reviewer, security-risk-reviewer]
    local_skills: [mvp-technical-design, secure-mvp-delivery]
    workbook_sections: [Delivery Design, Build Traceability, Verification Evidence, Risk Register]
    aas_capabilities: [architecture, documentation-and-adrs, security-and-hardening, privacy-by-design, cloud-devops, full-stack-orchestration-full-stack-feature, testing-qa, e2e-testing, accessibility-compliance-accessibility-audit]
    completion_signals: [in-scope work is traceable, tests report actual results, material risks and known issues are explicit]
  - id: mvp-learning
    name: optional controlled learning and post-MVP operations
    purpose: Plan and analyze authorized beta, launch, support, and growth work without making it a prerequisite for completing an MVP.
    primary_roles: [product-analytics-analyst, launch-growth-operator, support-insights-analyst]
    local_skills: [beta-launch-learn]
    workbook_sections: [Measurement Plan, Verification Evidence, Post-MVP Options]
    aas_capabilities: [analytics-product, growth-engine, customer-support, marketing-plan]
    completion_signals: [actual results are separated from plans, next experiment is evidence-led]
collaboration:
  - Founder intent remains visible in every workstream and cannot be silently overwritten.
  - Workstreams may start, pause, loop, and run in parallel as evidence or implementation needs change.
  - Research changes must update the MVP definition when they affect target user, outcome, scope, pricing, claims, or risk.
  - Delivery discoveries must update the MVP definition when they affect feasibility, cost, trust, or user experience.
  - External actions require authorization but do not create an internal workflow gate.
